<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HeartPrint — Progressive Cardiac Identity Engine</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background:
        radial-gradient(circle at center,
        #10202a 0%,
        #071116 45%,
        #020608 100%);
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    color: #e8ffff;
    user-select: none;
}

/* =========================================================
   MAIN INTERFACE
   ========================================================= */

.heartprint {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* =========================================================
   HEADER
   ========================================================= */

.header {
    position: absolute;
    top: 30px;
    left: 40px;
    z-index: 10;
}

.logo {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 4px;
    color: #7ffcff;
    text-shadow: 0 0 12px rgba(127, 252, 255, 0.4);
}

.subtitle {
    margin-top: 5px;
    font-size: 11px;
    letter-spacing: 2px;
    color: #78949b;
}

/* =========================================================
   CONTROLS / SUBJECT SELECTOR
   ========================================================= */

.controls {
    position: absolute;
    top: 30px;
    right: 240px;
    z-index: 15;
    display: flex;
    gap: 10px;
    align-items: center;
}

.subject-input {
    background: rgba(4, 25, 33, 0.7);
    border: 1px solid rgba(100, 255, 255, 0.3);
    color: #8affff;
    padding: 7px 12px;
    border-radius: 4px;
    font-size: 11px;
    letter-spacing: 1px;
    outline: none;
    width: 110px;
}

.btn-auth {
    background: linear-gradient(135deg, #0f3f4c, #096875);
    border: 1px solid #56f7ff;
    color: #e8ffff;
    padding: 7px 15px;
    border-radius: 4px;
    font-size: 11px;
    letter-spacing: 1.5px;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 0 10px rgba(86, 247, 255, 0.2);
}

.btn-auth:hover {
    background: linear-gradient(135deg, #145567, #0ca0b5);
    box-shadow: 0 0 16px rgba(86, 247, 255, 0.5);
    transform: translateY(-1px);
}

/* =========================================================
   BIOMETRIC CORE
   ========================================================= */

.biometric-core {
    position: relative;
    width: 420px;
    height: 420px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

/* Outer scanning rings */

.ring {
    position: absolute;
    border: 1px solid rgba(90, 245, 255, 0.25);
    border-radius: 50%;
    pointer-events: none;
}

.ring-1 {
    width: 420px;
    height: 420px;
    animation: rotate 15s linear infinite;
}

.ring-2 {
    width: 340px;
    height: 340px;
    border-style: dashed;
    animation: rotateReverse 12s linear infinite;
}

.ring-3 {
    width: 260px;
    height: 260px;
    border-color: rgba(255, 65, 100, 0.35);
    animation: pulseRing 2s ease-in-out infinite;
}

/* =========================================================
   HEART
   ========================================================= */

.heartbeat {
    position: absolute;
    width: 90px;
    height: 60px;

    transform: translate(-50%, -50%);
    transform-origin: center;

    animation: heartBeat 1.1s ease-in-out infinite;

    filter:
        drop-shadow(0 0 8px #ff3155)
        drop-shadow(0 0 25px rgba(255, 49, 85, 0.6));

    z-index: 5;
    transition: filter 0.3s ease;
}

.heartbeat.verified {
    filter:
        drop-shadow(0 0 8px #00ffaa)
        drop-shadow(0 0 25px rgba(0, 255, 170, 0.7));
}

.heartbeat.verified::after {
    box-shadow:
        30px 10px #00ffaa,
        40px 10px #00ffaa,
        60px 10px #00ffaa,
        70px 10px #00ffaa,

        20px 20px #00ffaa,
        30px 20px #00ffaa,
        40px 20px #00ffaa,
        50px 20px #00ffaa,
        60px 20px #00ffaa,
        70px 20px #00ffaa,
        80px 20px #00ffaa,

        20px 30px #00ffaa,
        30px 30px #00ffaa,
        40px 30px #00ffaa,
        50px 30px #00ffaa,
        60px 30px #00ffaa,
        70px 30px #00ffaa,
        80px 30px #00ffaa,

        30px 40px #00ffaa,
        40px 40px #00ffaa,
        50px 40px #00ffaa,
        60px 40px #00ffaa,
        70px 40px #00ffaa,

        40px 50px #00ffaa,
        50px 50px #00ffaa,
        60px 50px #00ffaa,

        50px 60px #00ffaa;
}

/*
    Pixel heart
*/

.heartbeat::after {
    position: absolute;

    top: -10px;
    left: -10px;

    width: 10px;
    height: 10px;

    content: "";

    box-shadow:
        30px 10px #ff3155,
        40px 10px #ff3155,
        60px 10px #ff3155,
        70px 10px #ff3155,

        20px 20px #ff3155,
        30px 20px #ff3155,
        40px 20px #ff3155,
        50px 20px #ff3155,
        60px 20px #ff3155,
        70px 20px #ff3155,
        80px 20px #ff3155,

        20px 30px #ff3155,
        30px 30px #ff3155,
        40px 30px #ff3155,
        50px 30px #ff3155,
        60px 30px #ff3155,
        70px 30px #ff3155,
        80px 30px #ff3155,

        30px 40px #ff3155,
        40px 40px #ff3155,
        50px 40px #ff3155,
        60px 40px #ff3155,
        70px 40px #ff3155,

        40px 50px #ff3155,
        50px 50px #ff3155,
        60px 50px #ff3155,

        50px 60px #ff3155;
}

/* =========================================================
   CARDIAC SIGNAL
   ========================================================= */

.ecg {
    position: absolute;
    width: 520px;
    height: 160px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    opacity: 0.75;

    z-index: 2;
}

.ecg svg {
    width: 100%;
    height: 100%;
}

.ecg-path {
    fill: none;
    stroke: #56f7ff;
    stroke-width: 2;

    stroke-dasharray: 700;
    stroke-dashoffset: 700;

    animation: ecgScan 2.2s linear infinite;

    filter:
        drop-shadow(0 0 5px #56f7ff);
}

/* =========================================================
   SCANNING LINE
   ========================================================= */

.scan-line {
    position: absolute;

    width: 300px;
    height: 2px;

    background: linear-gradient(
        90deg,
        transparent,
        #62ffff,
        transparent
    );

    box-shadow: 0 0 15px #62ffff;

    animation: scan 2.5s ease-in-out infinite;

    z-index: 7;
}

/* =========================================================
   DATA PARTICLES
   ========================================================= */

.particle {
    position: absolute;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: #61faff;

    box-shadow: 0 0 8px #61faff;

    animation: particleFloat 3s linear infinite;
}

.p1 {
    top: 20%;
    left: 20%;
}

.p2 {
    top: 75%;
    left: 25%;
    animation-delay: .7s;
}

.p3 {
    top: 25%;
    right: 20%;
    animation-delay: 1.2s;
}

.p4 {
    bottom: 20%;
    right: 25%;
    animation-delay: 1.8s;
}

/* =========================================================
   STATUS PANEL
   ========================================================= */

.status-panel {
    position: absolute;

    bottom: 40px;
    left: 50%;

    transform: translateX(-50%);

    width: 460px;

    text-align: center;

    z-index: 10;
}

.status {
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #70faff;
    transition: color 0.3s ease;
}

.progress {
    width: 100%;
    height: 4px;

    margin-top: 15px;

    background: rgba(255,255,255,0.08);

    overflow: hidden;
    border-radius: 2px;
}

.progress-bar {
    width: 0%;
    height: 100%;

    background: #5dfaff;

    box-shadow: 0 0 10px #5dfaff;

    transition: width 0.3s ease;
}

.identity-id {
    margin-top: 12px;

    font-size: 10px;
    letter-spacing: 2px;

    color: #58747b;
}

.metrics-badges {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 10px;
    font-size: 11px;
    letter-spacing: 1px;
    color: #88c8d8;
}

.badge-item {
    background: rgba(8, 30, 38, 0.6);
    border: 1px solid rgba(86, 247, 255, 0.2);
    padding: 3px 8px;
    border-radius: 3px;
}

/* =========================================================
   AUTHENTICATION BADGE
   ========================================================= */

.auth-status {
    position: absolute;

    top: 35px;
    right: 40px;

    padding: 10px 16px;

    border: 1px solid rgba(100,255,255,0.25);

    background: rgba(0,20,25,0.5);

    font-size: 10px;
    letter-spacing: 2px;

    color: #6ffcff;
    border-radius: 3px;
}

.dot {
    display: inline-block;

    width: 6px;
    height: 6px;

    margin-right: 7px;

    border-radius: 50%;

    background: #65ffb0;

    box-shadow: 0 0 10px #65ffb0;

    animation: statusPulse 1s infinite;
}

/* =========================================================
   ANIMATIONS
   ========================================================= */

@keyframes heartBeat {

    0% {
        transform: scale(1);
    }

    15% {
        transform: scale(1.15);
    }

    30% {
        transform: scale(1);
    }

    45% {
        transform: scale(1.08);
    }

    60%,
    100% {
        transform: scale(1);
    }
}

@keyframes ecgScan {

    0% {
        stroke-dashoffset: 700;
    }

    100% {
        stroke-dashoffset: 0;
    }
}

@keyframes scan {

    0% {
        transform: translate(-50%, -150px);
        opacity: 0;
    }

    30% {
        opacity: 1;
    }

    70% {
        opacity: 1;
    }

    100% {
        transform: translate(-50%, 150px);
        opacity: 0;
    }
}

@keyframes rotate {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

@keyframes rotateReverse {

    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }
}

@keyframes pulseRing {

    0%,
    100% {
        transform: scale(0.95);
        opacity: .4;
    }

    50% {
        transform: scale(1.05);
        opacity: .9;
    }
}

@keyframes particleFloat {

    0% {
        transform: translateY(40px);
        opacity: 0;
    }

    30% {
        opacity: 1;
    }

    100% {
        transform: translateY(-80px);
        opacity: 0;
    }
}

@keyframes statusPulse {

    0%,
    100% {
        opacity: .4;
    }

    50% {
        opacity: 1;
    }
}
</style>
</head>

<body>

<div class="heartprint">

    <!-- BRAND -->
    <div class="header">
        <div class="logo">HEARTPRINT</div>
        <div class="subtitle">
            PROGRESSIVE CARDIAC IDENTITY ENGINE
        </div>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
        <input id="subjectInput" class="subject-input" type="text" value="0004" placeholder="Subject ID" />
        <button id="authBtn" class="btn-auth">AUTHENTICATE</button>
    </div>

    <!-- SYSTEM STATUS -->
    <div class="auth-status" id="sensorStatusBadge">
        <span class="dot" id="statusDot"></span>
        <span id="sensorStatusText">CARDIAC SENSOR ONLINE</span>
    </div>

    <!-- BIOMETRIC CORE -->
    <div class="biometric-core" id="coreContainer" title="Click to trigger biometric scan">

        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-3"></div>

        <!-- ECG SIGNAL -->
        <div class="ecg">
            <svg viewBox="0 0 520 160">
                <path
                    class="ecg-path"
                    d="
                    M0 80
                    L70 80
                    L90 80
                    L105 80
                    L120 80
                    L130 60
                    L140 100
                    L150 80
                    L190 80
                    L210 80
                    L225 80
                    L240 20
                    L255 140
                    L270 80
                    L320 80
                    L350 80
                    L365 60
                    L375 100
                    L385 80
                    L430 80
                    L520 80
                    "
                />
            </svg>
        </div>

        <!-- HEART -->
        <div class="heartbeat" id="heartElement"></div>

        <!-- SCANNER -->
        <div class="scan-line"></div>

    </div>

    <!-- PARTICLES -->
    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>

    <!-- STATUS PANEL -->
    <div class="status-panel">
        <div class="status" id="statusText">
            ACQUIRING CARDIAC SIGNATURE
        </div>

        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="metrics-badges">
            <span class="badge-item">BPM: <strong id="bpmVal">72</strong></span>
            <span class="badge-item">SQI: <strong id="sqiVal">0.89</strong></span>
            <span class="badge-item">PIECES: <strong id="puzzleVal">20/20</strong></span>
            <span class="badge-item">MATCH: <strong id="matchVal">99.4%</strong></span>
        </div>

        <div class="identity-id" id="identityFooter">
            HEARTPRINT ID: SUB-0004 • PROGRESSIVE ENROLLMENT ACTIVE
        </div>
    </div>

</div>

<script>
let isScanning = false;
const statusText = document.getElementById("statusText");
const progressBar = document.getElementById("progressBar");
const heartElement = document.getElementById("heartElement");
const subjectInput = document.getElementById("subjectInput");
const authBtn = document.getElementById("authBtn");
const bpmVal = document.getElementById("bpmVal");
const sqiVal = document.getElementById("sqiVal");
const puzzleVal = document.getElementById("puzzleVal");
const matchVal = document.getElementById("matchVal");
const identityFooter = document.getElementById("identityFooter");

function triggerScan() {
    if (isScanning) return;
    isScanning = true;
    const subject = subjectInput.value.trim() || "0004";
    
    heartElement.classList.remove("verified");
    statusText.textContent = `ACQUIRING CARDIAC SIGNATURE (SUB-${subject})`;
    statusText.style.color = "#70faff";
    progressBar.style.width = "0%";
    identityFooter.textContent = `HEARTPRINT ID: SUB-${subject} • CROSS-ATTENTION EXTRACTOR RUNNING`;

    let progress = 0;
    const interval = setInterval(() => {
        progress += Math.floor(Math.random() * 12) + 8;
        if (progress > 90 && progress < 100) {
            statusText.textContent = "VERIFYING BIOMETRIC SUBSPACE PIECES...";
        }
        if (progress >= 100) {
            progress = 100;
            clearInterval(interval);
            completeAuth(subject);
        }
        progressBar.style.width = progress + "%";
        bpmVal.textContent = (68 + Math.floor(Math.random() * 8));
        sqiVal.textContent = (0.82 + Math.random() * 0.15).toFixed(2);
    }, 200);
}

function completeAuth(subject) {
    heartElement.classList.add("verified");
    statusText.textContent = `IDENTITY VERIFIED • ACCESS GRANTED (SUB-${subject})`;
    statusText.style.color = "#00ffaa";
    matchVal.textContent = (98.5 + Math.random() * 1.4).toFixed(1) + "%";
    puzzleVal.textContent = "20/20";
    identityFooter.textContent = `HEARTPRINT CERTIFIED • DIGITAL TWIN SYNCHRONIZED`;

    setTimeout(() => {
        isScanning = false;
    }, 2500);
}

authBtn.addEventListener("click", triggerScan);
document.getElementById("coreContainer").addEventListener("click", triggerScan);

// Auto-run initial pulse animation
setTimeout(triggerScan, 800);
</script>

</body>
</html>
