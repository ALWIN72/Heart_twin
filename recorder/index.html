<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#FF5A1F" />
  <meta name="description" content="Personalized cardiac motion monitoring from smartphone seismocardiography." />
  <title>Digital Heart Twin</title>
  
  <script>
    // Force purge any legacy service workers and disk caches immediately on load
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (var i = 0; i < regs.length; i++) {
          regs[i].unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(keys) {
        for (var i = 0; i < keys.length; i++) {
          caches.delete(keys[i]);
        }
      });
    }
  </script>

  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./styles/tokens.css?v=10" />
  <link rel="stylesheet" href="./styles/base.css?v=10" />
  <link rel="stylesheet" href="./styles/components.css?v=10" />
  <link rel="stylesheet" href="./styles/print.css?v=10" />
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div class="phone-viewport-wrapper">
    <div id="app-root">
      
      <!-- Main Screens Container -->
      <main id="main-content" role="main" tabindex="-1">
        
        <!-- SCREEN 1: ONBOARDING -->
        <section class="app-screen" id="screen-onboarding" aria-label="App Onboarding"></section>

        <!-- SCREEN 2: AUTH -->
        <section class="app-screen" id="screen-auth" aria-label="Patient Sign In and Register"></section>

        <!-- SCREEN 3: HOME (Pre-rendered for instantaneous zero-latency mobile display) -->
        <section class="app-screen active" id="screen-home" aria-label="Home Dashboard">
          <div class="home-screen-wrap" style="width:100%; height:100%; position:relative; display:flex; flex-direction:column; justify-content:space-between; padding: 24px 24px 104px 24px; background: #4A150A linear-gradient(180deg, #4A150A 0%, #7A2412 35%, #C2410C 65%, #FF5A1F 100%) center/cover no-repeat; overflow:hidden;">
            
            <!-- Top Bar: Logo & 44px Glass Hamburger Circle -->
            <div style="display:flex; justify-content:space-between; align-items:center; z-index:10;">
              <div style="display:flex; align-items:center; gap:8px; color:#FFFFFF;">
                <div style="width:38px; height:38px; border-radius:12px; background:rgba(255,255,255,0.18); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;">
                  <div class="heart-pulse" style="color:#FFFFFF;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                    </svg>
                  </div>
                </div>
              </div>

              <button class="glass-circle-btn" id="home-menu-btn" onclick="window.toggleDrawer && window.toggleDrawer()" aria-label="Open menu">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
                </svg>
              </button>
            </div>

            <!-- Hero Zone -->
            <div style="display:flex; flex-direction:column; gap:14px; margin-top:14px; z-index:10;">
              <div>
                <div style="font-size:28px; line-height:1.2; color:#FFFFFF;" id="home-greeting-line">
                  <span style="font-weight:700;">Hi, </span><span style="font-weight:300;">Amelia!</span>
                </div>
                <div style="font-size:14px; color:rgba(255,255,255,0.85); font-weight:400; margin-top:3px;">
                  Good to see you again
                </div>
              </div>

              <!-- Glass Status Pill -->
              <div class="glass-status-pill" id="home-status-pill">
                <span class="status-dot normal"></span>
                <span id="home-status-text">Normal for you</span>
                <span style="font-size:11px; opacity:0.7; margin-left:2px;">ⓘ</span>
              </div>

              <!-- Hero Title (48px, 2 Lines) -->
              <h1 class="hero-title" style="margin-top:2px;">
                Morning<br/>Heart Check
              </h1>

              <!-- Hero Subtitle -->
              <p style="font-size:15px; color:rgba(255,255,255,0.88); line-height:1.42; max-width:310px;">
                Lie still for 60 seconds and see how your heart compares with your usual.
              </p>

              <!-- Dynamic Ambient Cardiac Pulse Strip -->
              <div style="height:32px; width:100%; max-width:280px; position:relative; opacity:0.75; margin-top:2px;">
                <canvas id="home-ambient-pulse-canvas" style="width:100%; height:100%;"></canvas>
              </div>

              <!-- White Pill Button: "Start Recording" -->
              <div style="margin-top:6px;">
                <button class="btn-white-pill" id="home-start-record-btn" onclick="window.navGo && window.navGo('record-browse')">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <polygon points="5 3 19 12 5 21 5 3"/>
                  </svg>
                  <span>Start Recording</span>
                </button>

                <!-- Small Glass Sub-line -->
                <div style="font-size:12px; color:rgba(255,255,255,0.65); margin-top:10px; margin-left:8px; font-weight:500;" id="home-last-check">
                  Last check: 72 bpm, regular
                </div>
              </div>
            </div>

            <!-- Horizontal Filter Chips Row -->
            <div style="z-index:10; margin-top:16px;">
              <div class="chip-row">
                <button class="filter-chip active" onclick="window.navGo && window.navGo('record-browse')">All</button>
                <button class="filter-chip" onclick="window.navGo && window.navGo('record-browse')">Check-in</button>
                <button class="filter-chip" onclick="window.navGo && window.navGo('calm')">Calm</button>
                <button class="filter-chip" onclick="window.navGo && window.navGo('record-browse')">Rest</button>
                <button class="filter-chip" onclick="window.navGo && window.navGo('record-browse')">Activity</button>
              </div>
            </div>

          </div>

          <!-- Slide-over Drawer Menu for Hamburger Button -->
          <div class="drawer-backdrop" id="home-drawer-backdrop" onclick="window.toggleDrawer && window.toggleDrawer()"></div>
          <div class="slide-menu" id="home-slide-menu">
            <div>
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:28px;">
                <div style="font-size:18px; font-weight:700;">Settings &amp; Menu</div>
                <button class="glass-circle-btn" onclick="window.toggleDrawer && window.toggleDrawer()" style="width:36px; height:36px;">
                  ✕
                </button>
              </div>

              <div style="background:rgba(255,255,255,0.12); border-radius:18px; padding:14px; margin-bottom:20px;">
                <div style="font-size:12px; color:rgba(255,255,255,0.7);">Signed in as:</div>
                <div style="font-size:16px; font-weight:700; margin-top:2px;" id="drawer-user-name">Amelia Vance</div>
                <div style="font-size:12px; color:var(--accent-orange); margin-top:2px;" id="drawer-subject-id">Subject #1001</div>
              </div>

              <div style="display:flex; flex-direction:column; gap:12px;">
                <button onclick="window.toggleDrawer && window.toggleDrawer(); window.navGo && window.navGo('onboarding');" style="background:transparent; border:none; color:#FFFFFF; display:flex; align-items:center; gap:12px; padding:10px 0; font-size:15px; cursor:pointer; text-align:left;">
                  <span>📱 Phone Placement Guide</span>
                </button>
                <button onclick="window.toggleDrawer && window.toggleDrawer(); window.navGo && window.navGo('trends');" style="background:transparent; border:none; color:#FFFFFF; display:flex; align-items:center; gap:12px; padding:10px 0; font-size:15px; cursor:pointer; text-align:left;">
                  <span>📊 View 30-Day Trends</span>
                </button>
                <button onclick="window.toggleDrawer && window.toggleDrawer(); window.navGo && window.navGo('share');" style="background:transparent; border:none; color:#FFFFFF; display:flex; align-items:center; gap:12px; padding:10px 0; font-size:15px; cursor:pointer; text-align:left;">
                  <span>📄 Share Doctor Summary</span>
                </button>
              </div>
            </div>

            <div>
              <button class="btn-orange-pill" onclick="window.toggleDrawer && window.toggleDrawer(); window.navGo && window.navGo('auth');" style="width:100%; justify-content:center; padding:12px;">
                Sign Out
              </button>
            </div>
          </div>
        </section>

        <!-- SCREEN 4: RECORD BROWSE -->
        <section class="app-screen" id="screen-record-browse" aria-label="What does your heart need today"></section>

        <!-- SCREEN 5: RECORD PLAYER -->
        <section class="app-screen" id="screen-record-player" aria-label="Recording in Progress"></section>

        <!-- SCREEN 6: CALM -->
        <section class="app-screen" id="screen-calm" aria-label="Guided Breathing"></section>

        <!-- SCREEN 7: RESULT -->
        <section class="app-screen" id="screen-result" aria-label="Recording Result"></section>

        <!-- SCREEN 8: TRENDS -->
        <section class="app-screen" id="screen-trends" aria-label="Trends & History"></section>

        <!-- SCREEN 9: PROFILE -->
        <section class="app-screen" id="screen-profile" aria-label="Profile and Settings"></section>

        <!-- SCREEN 10: SHARE -->
        <section class="app-screen" id="screen-share" aria-label="Clinical Summary Report"></section>
      </main>

      <!-- Floating 5-Tab Navigation Bar (Home, Record, Calm, Trends, Profile) -->
      <nav class="floating-bottom-nav nav-glass" id="floating-bottom-nav" role="navigation" aria-label="Main Navigation">
        <!-- Tab 1: Home -->
        <button class="nav-item-btn active" data-target="home" aria-label="Home" aria-selected="true" onclick="window.navGo && window.navGo('home')">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          <span class="nav-item-label">Home</span>
        </button>

        <!-- Tab 2: Record -->
        <button class="nav-item-btn" data-target="record-browse" aria-label="Record heart motion" aria-selected="false" onclick="window.navGo && window.navGo('record-browse')">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z"/>
            <path d="M12 8v8"/>
            <path d="M8 12h8"/>
          </svg>
          <span class="nav-item-label">Record</span>
        </button>

        <!-- Tab 3: Calm -->
        <button class="nav-item-btn" data-target="calm" aria-label="Calm breathing" aria-selected="false" onclick="window.navGo && window.navGo('calm')">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <span class="nav-item-label">Calm</span>
        </button>

        <!-- Tab 4: Trends -->
        <button class="nav-item-btn" data-target="trends" aria-label="Trends & Stats" aria-selected="false" onclick="window.navGo && window.navGo('trends')">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10"/>
            <line x1="12" y1="20" x2="12" y2="4"/>
            <line x1="6" y1="20" x2="6" y2="14"/>
          </svg>
          <span class="nav-item-label">Trends</span>
        </button>

        <!-- Tab 5: Profile -->
        <button class="nav-item-btn" data-target="profile" aria-label="Patient Profile and Settings" aria-selected="false" onclick="window.navGo && window.navGo('profile')">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <span class="nav-item-label">Profile</span>
        </button>
      </nav>

      <!-- Toast Notification Container -->
      <div class="toast-container" id="toast-container" aria-live="polite"></div>

      <!-- Global High-Z-Index Modal Bottom Sheet (Outside screen stacking context) -->
      <div class="drawer-backdrop" id="global-sheet-backdrop" onclick="window.closeBottomSheet && window.closeBottomSheet()"></div>
      <div class="bottom-sheet" id="global-bottom-sheet" role="dialog" aria-modal="true">
        <div class="sheet-handle"></div>
        <div id="global-sheet-content"></div>
      </div>

    </div>
  </div>

  <!-- Immediate Non-blocking Navigation Engine (Works on all mobile & desktop browsers) -->
  <script>
    window._currentScreenId = 'home';

    window.openBottomSheet = function(html, onMount, onClose) {
      var backdrop = document.getElementById('global-sheet-backdrop');
      var sheet = document.getElementById('global-bottom-sheet');
      var content = document.getElementById('global-sheet-content');
      var bottomNav = document.getElementById('floating-bottom-nav');

      if (content) content.innerHTML = html;
      if (backdrop) backdrop.classList.add('active');
      if (sheet) sheet.classList.add('active');
      if (bottomNav) bottomNav.classList.add('nav-hidden');

      window._sheetOnClose = onClose;
      if (typeof onMount === 'function') onMount(content);
    };

    window.closeBottomSheet = function() {
      var backdrop = document.getElementById('global-sheet-backdrop');
      var sheet = document.getElementById('global-bottom-sheet');
      var bottomNav = document.getElementById('floating-bottom-nav');

      if (backdrop) backdrop.classList.remove('active');
      if (sheet) sheet.classList.remove('active');

      var cur = window._currentScreenId || 'home';
      var tabs = ['home', 'record-browse', 'calm', 'trends', 'profile'];
      if (bottomNav && tabs.indexOf(cur) !== -1) {
        bottomNav.classList.remove('nav-hidden');
      }

      if (typeof window._sheetOnClose === 'function') {
        window._sheetOnClose();
        window._sheetOnClose = null;
      }
    };

    window.toggleDrawer = function() {
      var d = document.getElementById('home-drawer-backdrop');
      var m = document.getElementById('home-slide-menu');
      if (d && m) {
        var isOpen = m.classList.contains('active');
        if (isOpen) {
          d.classList.remove('active');
          m.classList.remove('active');
        } else {
          d.classList.add('active');
          m.classList.add('active');
        }
      }
    };

    window.navGo = function(target) {
      window._currentScreenId = target;
      // Close any open sheet when navigating
      if (typeof window.closeBottomSheet === 'function') {
        window.closeBottomSheet();
      }

      var screens = document.querySelectorAll('.app-screen');
      for (var i = 0; i < screens.length; i++) {
        screens[i].classList.remove('active');
      }
      var targetEl = document.getElementById('screen-' + target);
      if (targetEl) {
        targetEl.classList.add('active');
        targetEl.scrollTop = 0;
      }

      var navBtns = document.querySelectorAll('.nav-item-btn');
      for (var j = 0; j < navBtns.length; j++) {
        if (navBtns[j].dataset.target === target) {
          navBtns[j].classList.add('active');
          navBtns[j].setAttribute('aria-selected', 'true');
        } else {
          navBtns[j].classList.remove('active');
          navBtns[j].setAttribute('aria-selected', 'false');
        }
      }

      var bottomNav = document.getElementById('floating-bottom-nav');
      if (bottomNav) {
        var tabScreens = ['home', 'record-browse', 'calm', 'trends', 'profile'];
        if (tabScreens.indexOf(target) !== -1) {
          bottomNav.classList.remove('nav-hidden');
          if (target === 'home') {
            bottomNav.className = 'floating-bottom-nav nav-glass';
          } else {
            bottomNav.className = 'floating-bottom-nav nav-light';
          }
        } else {
          bottomNav.classList.add('nav-hidden');
        }
      }

      if (typeof window.__loadScreenModule === 'function') {
        window.__loadScreenModule(target);
      }
    };
  </script>

  <!-- ES Module Application Controller -->
  <script type="module">
    import { initNavigation, navigateTo } from './ui/nav.js';
    import { openDB, getSetting, setSetting } from './storage/db.js';
    import { runMigrationIfNeeded } from './storage/migrate.js';
    import { getCurrentUser } from './api/client.js';

    import { renderOnboarding } from './screens/onboarding.js';
    import { renderAuth } from './screens/auth.js';
    import { renderHome } from './screens/home.js';
    import { renderRecordBrowse } from './screens/record-browse.js';
    import { renderRecordPlayer } from './screens/record-player.js';
    import { renderCalm } from './screens/calm.js';
    import { renderResult } from './screens/result.js';
    import { renderTrends } from './screens/trends.js';
    import { renderProfile } from './screens/profile.js';
    import { renderShare } from './screens/share.js';
    import { showToast } from './ui/toast.js';

    let currentUser = null;

    async function loadScreen(screenId) {
      try {
        switch (screenId) {
          case 'onboarding': {
            const c = document.getElementById('screen-onboarding');
            renderOnboarding(c, {
              onComplete: () => {
                if (currentUser) {
                  window.navGo('home');
                } else {
                  window.navGo('auth');
                }
              }
            });
            break;
          }

          case 'auth': {
            const c = document.getElementById('screen-auth');
            renderAuth(c, {
              initialMode: 'login',
              onSuccess: (user) => {
                currentUser = user;
                window.navGo('home');
              }
            });
            break;
          }

          case 'home': {
            const c = document.getElementById('screen-home');
            await renderHome(c, {
              user: currentUser,
              onStartRecording: () => window.navGo('record-browse')
            });
            break;
          }

          case 'record-browse': {
            const c = document.getElementById('screen-record-browse');
            await renderRecordBrowse(c, { user: currentUser });
            break;
          }

          case 'record-player': {
            const c = document.getElementById('screen-record-player');
            renderRecordPlayer(c, { context: 'Resting', duration: 60, user: currentUser });
            break;
          }

          case 'calm': {
            const c = document.getElementById('screen-calm');
            renderCalm(c, {
              onDone: () => window.navGo('record-browse')
            });
            break;
          }

          case 'result': {
            const c = document.getElementById('screen-result');
            const { getRecordings } = await import('./storage/db.js');
            const recs = await getRecordings(currentUser ? currentUser.subject_id : '1001', 1);
            renderResult(c, {
              analysisResult: recs[0] || { hr: 72, sdnn: 45, rmssd: 36, pnn50: 15, qualityScore: 94, verdict: 'Normal for you' },
              serverScoreResult: { score: 0.018, threshold: 0.050 },
              context: (recs[0] && recs[0].context) || 'Resting',
              user: currentUser
            });
            break;
          }

          case 'trends': {
            const c = document.getElementById('screen-trends');
            await renderTrends(c, { user: currentUser });
            break;
          }

          case 'profile': {
            const c = document.getElementById('screen-profile');
            await renderProfile(c, {
              user: currentUser,
              onLogout: () => {
                currentUser = null;
              }
            });
            break;
          }

          case 'share': {
            const c = document.getElementById('screen-share');
            await renderShare(c, { user: currentUser });
            break;
          }
        }
      } catch (err) {
        console.error(`[Router] Error loading screen ${screenId}:`, err);
      }
    }

    // Bridge standard navGo with ES module renderer
    window.__loadScreenModule = loadScreen;

    async function initApp() {
      try {
        await openDB();
      } catch (e) {
        console.warn('DB open error:', e);
      }

      // Check User Authentication
      try {
        currentUser = await getCurrentUser();
        if (!currentUser) {
          currentUser = await getSetting('current_user', null);
        }
      } catch (e) {
        console.warn('Auth check error:', e);
      }

      try {
        await runMigrationIfNeeded(currentUser ? currentUser.subject_id : null);
      } catch (e) {
        console.warn('Migration warning:', e);
      }

      initNavigation({
        onScreenChange: (newScreen) => {
          loadScreen(newScreen);
        }
      });

      // Mount dynamic listeners & state for home
      await loadScreen('home');

      // Update drawer info if user exists
      if (currentUser) {
        const dName = document.getElementById('drawer-user-name');
        const dSub = document.getElementById('drawer-subject-id');
        const hGreet = document.getElementById('home-greeting-line');
        if (dName) dName.textContent = currentUser.name || currentUser.username;
        if (dSub) dSub.textContent = 'Subject #' + currentUser.subject_id;
        if (hGreet) {
          const fName = (currentUser.name || currentUser.username).split(' ')[0];
          hGreet.innerHTML = '<span style="font-weight:700;">Hi, </span><span style="font-weight:300;">' + fName + '!</span>';
        }
      }
    }

    initApp();
  </script>
</body>
</html>
